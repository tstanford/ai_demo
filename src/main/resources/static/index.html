<!DOCTYPE html>
<html>
<head>
    <title>AI Chat</title>
    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: 50px auto;
        }

        #chat {
            height: 500px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            white-space: pre-wrap;
        }

        .user {
            color: blue;
            margin: 10px 0;
        }

        .bot {
            color: green;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<h1>Local AI Assistant</h1>

<div id="chat"></div>

<form id="chatForm">
    <input id="message" type="text" style="width:80%" autofocus>
    <button type="submit">Send</button>
</form>

<script>
    const input = document.getElementById("message");

    function restoreFocus() {
        input.focus();
    }

    window.addEventListener("load", restoreFocus);

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            send();
            restoreFocus();
        }
    });

    document.getElementById("chatForm").addEventListener("submit", (event) => {
        event.preventDefault();
        send();
        restoreFocus();
    });

    async function send() {
        const text = input.value;

        const chat = document.getElementById("chat");

        chat.innerHTML += `<div class="user"><b>You:</b> ${text}</div>`;

        input.value = "";
        restoreFocus();

        // Create empty AI message
        const botDiv = document.createElement("div");
        botDiv.className = "bot";
        botDiv.innerHTML = "<b>AI:</b> ";

        chat.appendChild(botDiv);

        const source = new EventSource(
            `/api/chat?message=${encodeURIComponent(text)}`
        );

        let answer = "";

        source.onmessage = (event) => {
            answer += event.data+ " ";

            // Update existing message instead of adding a new one
            botDiv.innerHTML = `<b>AI:</b> ${answer}`;

            // Auto-scroll
            chat.scrollTop = chat.scrollHeight;
        };

        source.onerror = () => {
            source.close();
        };
    }

</script>

</body>
</html>
